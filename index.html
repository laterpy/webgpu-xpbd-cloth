<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>WebGPU XPBD Cloth Photo</title>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <div class="brand">
          <span class="eyebrow">WEBGPU / XPBD</span>
          <strong>Hanging Photo Cloth</strong>
        </div>

        <div class="controls" role="group" aria-label="照片控制台">
          <div class="action-controls">
            <label class="file-button">
              <input
                id="imageInput"
                class="visually-hidden"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/avif"
                multiple
              />
              添加图片
            </label>
            <button id="resetButton" type="button">复位当前</button>
          </div>

          <div class="gallery-navigation" role="group" aria-label="图片切换">
            <button id="previousButton" class="navigation-button" type="button" aria-label="上一张" disabled>
              <span aria-hidden="true">&#8592;</span>
            </button>
            <output id="galleryCounter" aria-label="当前图片">1 / 1</output>
            <button id="nextButton" class="navigation-button" type="button" aria-label="下一张" disabled>
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>

          <label class="range-control">
            <span class="range-heading">
              <span>风力</span>
              <output id="windValue" for="windInput">0.00</output>
            </span>
            <input id="windInput" type="range" min="0" max="4" step="0.05" value="0" />
          </label>
          <label class="range-control">
            <span class="range-heading">
              <span>重力</span>
              <output id="gravityValue" for="gravityInput">7.8</output>
            </span>
            <input id="gravityInput" type="range" min="1" max="12" step="0.1" value="7.8" />
          </label>
        </div>

        <div id="interactionHint" class="hint">按住照片任意位置轻柔拖拽 · 左右切换 · 松开后自然回摆</div>
        <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
          初始化 WebGPU…
        </div>
      </div>
      <div id="error" class="error" role="alert" tabindex="0" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
